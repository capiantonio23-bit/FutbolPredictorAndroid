
name: Crear APK de FutbolPredictorAndroid

on:
  workflow_dispatch:

jobs:
  compilar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android
        uses: android-actions/setup-android@v3

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Descomprimir proyecto
        run: unzip -o FutbolPredictorAndroid-CORREGIDO.zip -d .

      - name: Compilar APK
        run: |
          cd FutbolPredictorAndroid
          gradle --no-daemon assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: FutbolPredictor-APK
          path: FutbolPredictorAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
